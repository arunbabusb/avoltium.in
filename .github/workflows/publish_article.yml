name: Publish Article to WordPress

on:
  schedule:
    - cron: '23 5 * * 1,3,5'  # Mon/Wed/Fri at 5:23 AM UTC — off-hour time looks natural
  workflow_dispatch:          # Allows manual trigger from GitHub Actions UI

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run article generator
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional. Unset means Auto Ads only, with no manual in-article unit.
          ADSENSE_SLOT_ID: ${{ secrets.ADSENSE_SLOT_ID }}
          # Optional. Unset means article generation calls Gemini directly.
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: python generate_article.py
