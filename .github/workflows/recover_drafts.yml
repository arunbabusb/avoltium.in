name: Recover Held Drafts

on:
  schedule:
    # 07:05 UTC daily — roughly 100 minutes after the 05:23 publish slot, so a
    # draft held by a failed image gets a second attempt the same morning
    # rather than waiting for someone to notice it in the Actions tab.
    - cron: '5 7 * * *'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      # Exits non-zero when a draft is still held, so a post that needs an
      # editor shows red instead of passing silently.
      - name: Regenerate missing images and publish recoverable drafts
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python recover_drafts.py
