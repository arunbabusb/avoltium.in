name: Backfill wrong featured images

permissions:
  contents: read

# Manual only. It reassigns featured images on published posts.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually upload and reassign (false = dry run)'
        type: boolean
        required: true
        default: false
      only:
        description: 'Substring filter on the post title (blank = all candidates)'
        default: ''
      limit:
        description: 'Max posts to change (0 = no cap)'
        default: '0'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet -r requirements.txt
      - name: Sanity-check the image rules before touching anything
        run: |
          python3 test_image_sourcing.py
          python3 test_diagrams.py
      - name: Backfill
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS=(--limit "${{ inputs.limit }}")
          [ -n "${{ inputs.only }}" ] && ARGS+=(--only "${{ inputs.only }}")
          [ "${{ inputs.execute }}" = "true" ] && ARGS+=(--execute)
          python backfill_images.py "${ARGS[@]}"
