name: Rewrite Thin and Syndicated Content (One-Time)

on:
  workflow_dispatch:
    inputs:
      retry_post_ids:
        description: >-
          Optional comma-separated post IDs to re-process (e.g. "279,172").
          Leave blank to process every target post. Use this to retry posts
          that failed on an earlier run without rewriting the rest.
        required: false
        default: ''

jobs:
  rewrite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Rewrite content
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional. Unset means content rewrites call Gemini directly.
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          RETRY_POST_IDS: ${{ inputs.retry_post_ids }}
        run: python rewrite_content.py

      # The backup is the only copy of the original bodies — keep it even if
      # the rewrite step fails partway through.
      - name: Upload original-content backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-backup-${{ github.run_id }}
          path: content_backup*.json
          retention-days: 90
